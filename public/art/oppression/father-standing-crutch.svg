<title id="title">father-standing-crutch</title><desc id="desc">Father before the arrest: one remaining leg, folded empty trouser end, axillary wooden crutch under one arm, hand gripping the support. Pale cap, long tunic, olive-brown waistcoat. His disability predates the arrest.</desc>
