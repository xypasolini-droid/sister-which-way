<title id="title">hero-worker-crouch</title><desc id="desc">Nura disguised as a boy in a plain pale gray cap, knee-length gray tunic and loose trousers, crouching low with both knees bent, arms protecting her chest, frightened eyes and a small tear. Her cap remains on in public.</desc>
