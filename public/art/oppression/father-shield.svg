<svg xmlns="http://www.w3.org/2000/svg" width="512" height="1024" viewBox="0 0 512 1024" role="img" aria-labelledby="title desc">
<title id="title">father-shield</title><desc id="desc">Father shields his daughter with one arm extended back and his other palm toward the patrolman, worried but firm. His right leg is absent: the empty trouser end is folded, only the left foot reaches the ground, and an axillary crutch braces him. No prosthetic.</desc>
