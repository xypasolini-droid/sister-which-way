<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">road-open-truck-departure</title><desc id="desc">Original departure scene: four passengers seated in the open rear bed: Nura in a pale gray cap and boy disguise to the left of her mother, mother in a muted blue-gray full-body outer covering, little brother, and older sister in a plain headscarf. Yusuf, a simply dressed capped man, is visible driving in the small front cab. No roof over passengers. Nura is embedded and must not be duplicated as an independent stage actor. Father is not aboard.</desc>
