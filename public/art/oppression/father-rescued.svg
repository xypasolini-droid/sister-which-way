<title id="title">father-rescued</title><desc id="desc">The weakened father lies on a wooden handcart after release, eyes closed, long beard, pale cap and worn olive-gray clothing. One remaining foot is visible, the other trouser end is folded under the blanket. He does not stand or suddenly regain a leg.</desc>
