<svg xmlns="http://www.w3.org/2000/svg" width="512" height="1024" viewBox="0 0 512 1024" role="img" aria-labelledby="title desc">
<title id="title">adult-builder</title><desc id="desc">Adult Nura in a plain green headscarf, loose gray-green long tunic and wide trousers. One hand supports a blank notebook; the other opens in an invitation for another woman to speak. Calm mature face, no uniform, armor, shield, spear or rifle. Original civilian dream-ending protagonist.</desc>
